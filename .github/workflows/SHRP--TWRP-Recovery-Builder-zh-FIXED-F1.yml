name: SHRP--TWRP-Recovery-Builder

on:
  workflow_dispatch:
    inputs:
      manifest_repo_url:
        description: 'TWRP manifest 仓库地址'
        required: true
        default: 'https://github.com/SHRP/manifest.git'
        type: choice
        options:
          - https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
          - https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git
          - https://github.com/SHRP/manifest.git
          - https://github.com/PitchBlackRecoveryProject/manifest_pb.git

      manifest_branch_preset:
        description: '选择常用的 manifest 分支（若选“自定义”，请在下方输入）'
        required: true
        default: 'shrp-12.1'
        type: choice
        options:
          - twrp-14.1
          - twrp-14
          - twrp-12.1
          - twrp-11
          - twrp-10.0-deprecated
          - twrp-9.0
          - twrp-8.1
          - twrp-7.1
          - twrp-6.0
          - twrp-5.1
          - twrp-4.4-deprecated
          - shrp-12.1
          - 自定义

      manifest_branch_custom:
        description: '如果上面选择了“自定义”，请在此输入自定义分支名'
        required: false
        default: ''

      device_tree_repo_url:
        description: '设备树 GitHub 仓库地址'
        required: true
        default: 'https://github.com/TanukiSan566/ums91581h10-HV-Rongyue-e5'
        type: string
      device_tree_branch:
        description: '设备树分支'
        required: true
        default: 'main'
        type: string
      device_tree_path:
        description: '设备树在源码中的存放路径'
        required: true
        default: 'device/fortuneship/ums91581h10'
        type: string

      lunch_target:
        description: 'lunch 目标（14/14.1 起必须写三段式 <product>-<release>-<variant>，release 段一般填 trunk_staging；若报未知 release，看下面“打印可用 release 列表”步骤的日志）'
        required: true
        default: 'twrp_ums91581h10-eng'
        type: string

      build_target:
        description: '请选择要编译的镜像（三个只能选一个）'
        required: true
        default: 'vendor_boot'
        type: choice
        options:
          - recovery
          - vendor_boot
          - boot

      upload_zip:
        description: '是否上传 ZIP 刷机包（作为 Artifact）'
        required: true
        default: true
        type: boolean

      upload_release:
        description: '是否将产物同时上传到 GitHub Release（默认开启）'
        required: true
        default: true
        type: boolean

      apply_sprd_drm_patch:
        description: '是否应用展讯DRM显示修复补丁（解决展讯平台TWRP卡Logo无法显示UI的问题）'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备编译环境
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip repo
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: 安装 Python 2.7（SHRP manifest 依赖，Ubuntu 22.04 默认不带 python2.7）
        run: |
          # actions/setup-python 已于 2023-06-19 停止提供 python2.7，这里改用自带运行库的 Miniconda2，
          # 不依赖系统 openssl 版本，装完后 python2.7 命令就能在 PATH 里找到
          wget -q https://repo.anaconda.com/miniconda/Miniconda2-latest-Linux-x86_64.sh -O /tmp/miniconda2.sh
          bash /tmp/miniconda2.sh -b -p "$HOME/miniconda2"
          echo "$HOME/miniconda2/bin" >> "$GITHUB_PATH"
          "$HOME/miniconda2/bin/python2.7" --version

      - name: 清理磁盘空间
        uses: rokibhasansagar/slimhub_actions@main

      - name: 确定最终使用的 manifest 分支
        id: manifest_branch
        run: |
          if [[ "${{ github.event.inputs.manifest_branch_preset }}" == "自定义" ]]; then
            BRANCH="${{ github.event.inputs.manifest_branch_custom }}"
            if [[ -z "$BRANCH" ]]; then
              echo "❌ 错误：选择了“自定义”但未填写自定义分支名"
              exit 1
            fi
          else
            BRANCH="${{ github.event.inputs.manifest_branch_preset }}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "✅ 使用的 manifest 分支: $BRANCH"

      - name: 初始化 repo
        run: |
          mkdir -p twrp
          cd twrp
          repo init -u "${{ github.event.inputs.manifest_repo_url }}" \
            -b "${{ steps.manifest_branch.outputs.branch }}" --depth=1

      - name: 通过 local manifest 添加自定义设备树
        run: |
          cd twrp
          mkdir -p .repo/local_manifests
          
          DEVICE_TREE_URL="${{ github.event.inputs.device_tree_repo_url }}"
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
          DEVICE_TREE_PATH="${{ github.event.inputs.device_tree_path }}"
          DEVICE_TREE_BRANCH="${{ github.event.inputs.device_tree_branch }}"
          
          if [[ $DEVICE_TREE_URL =~ ^(https?://[^/]+)/(.*)$ ]]; then
            FETCH="${BASH_REMATCH[1]}"
            NAME="${BASH_REMATCH[2]}"
          elif [[ $DEVICE_TREE_URL =~ ^(git@[^:]+):(.*)$ ]]; then
            FETCH="${BASH_REMATCH[1]}:"
            NAME="${BASH_REMATCH[2]}"
          else
            echo "❌ 不支持的 URL 格式: $DEVICE_TREE_URL"
            exit 1
          fi
          
          cat > .repo/local_manifests/custom_device.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="custom" fetch="$FETCH" />
            <project path="$DEVICE_TREE_PATH" name="$NAME" remote="custom" revision="$DEVICE_TREE_BRANCH" />
          </manifest>
          EOF
          
          echo "✅ 已生成 local manifest"

      - name: 同步源码
        run: |
          cd twrp
          repo sync --force-sync --no-tags --no-clone-bundle -j$(nproc)

      - name: 修复 SHRP 已知的 libfscrypttwrp 拼写错误
        run: |
          FILE="twrp/system/core/fs_mgr/Android.bp"
          if [ -f "$FILE" ] && grep -q "libfscrypttwrp" "$FILE"; then
            sed -i 's/libfscrypttwrp/libfscrypt/g' "$FILE"
            echo "✅ 已将 $FILE 中的 libfscrypttwrp 修正为 libfscrypt"
          else
            echo "ℹ️ 未发现 libfscrypttwrp 引用（可能不是 SHRP manifest，或已修复），跳过"
          fi

      - name: 打印可用 release 列表（仅 Android 14/14.1 分支需要参考）
        run: |
          MAP="twrp/build/release/release_config_map.textproto"
          if [ -f "$MAP" ]; then
            echo "📋 本分支合法的 release 名称（用于 lunch 三段式的中间段）："
            grep -oP '(?<=name: ")[^"]+' "$MAP" || cat "$MAP"
          else
            echo "ℹ️ 未找到 release_config_map.textproto，说明这个 manifest 分支还是旧的两段式 lunch（12.1 及更早），可以忽略本步骤"
          fi

      - name: 校正 lunch 目标（Android 14/14.1 自动补齐 release 段）
        id: lunch_fix
        run: |
          RAW="${{ github.event.inputs.lunch_target }}"
          BRANCH="${{ steps.manifest_branch.outputs.branch }}"
          DASH_COUNT=$(grep -o '-' <<< "$RAW" | wc -l)

          if [[ "$BRANCH" == "twrp-14.1" || "$BRANCH" == "twrp-14" ]] && [ "$DASH_COUNT" -eq 1 ]; then
            PRODUCT="${RAW%-*}"
            VARIANT="${RAW##*-}"
            FIXED="${PRODUCT}-trunk_staging-${VARIANT}"
            echo "⚠️ 检测到 $BRANCH 需要三段式 lunch，已自动把 '$RAW' 转换为 '$FIXED'"
            echo "   如果编译报 release 名未知，请参照上一步打印的列表，把 trunk_staging 换成里面列出的名字"
            echo "target=$FIXED" >> $GITHUB_OUTPUT
          else
            echo "✅ 使用原始 lunch 目标：$RAW"
            echo "target=$RAW" >> $GITHUB_OUTPUT
          fi

      # ========== 可选：应用展讯DRM补丁 ==========
      - name: 应用展讯DRM显示修复补丁
        if: github.event.inputs.apply_sprd_drm_patch == 'true'
        run: |
          echo "📦 正在克隆展讯DRM补丁仓库..."
          git clone https://github.com/rtyutechstudio/unisoc-twrp-sourcecode_patch.git /tmp/sprd_patch
          
          TARGET_FILE="twrp/bootable/recovery/minuitwrp/graphics_drm.cpp"
          
          if [ -f "$TARGET_FILE" ]; then
            echo "🗑️ 删除原 graphics_drm.cpp..."
            rm -f "$TARGET_FILE"
          else
            echo "⚠️ 警告：原文件不存在，可能路径不正确，请检查设备树配置"
          fi
          
          echo "📋 复制修复版 graphics_drm.cpp.sprd_legacy_kms_fixed -> graphics_drm.cpp..."
          cp /tmp/sprd_patch/graphics_drm.cpp.sprd_legacy_kms_fixed "$TARGET_FILE"
          
          echo "✅ 展讯DRM补丁已应用"

      # 编译 recovery
      - name: 编译 recovery 镜像
        if: github.event.inputs.build_target == 'recovery'
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch ${{ steps.lunch_fix.outputs.target }}
          make clean
          export USE_CCACHE=0
          mka recoveryimage

      # 编译 vendor_boot
      - name: 编译 vendor_boot 镜像
        if: github.event.inputs.build_target == 'vendor_boot'
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch ${{ steps.lunch_fix.outputs.target }}
          export USE_CCACHE=0
          mka vendorbootimage

      # 编译 boot
      - name: 编译 boot 镜像
        if: github.event.inputs.build_target == 'boot'
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch ${{ steps.lunch_fix.outputs.target }}
          export USE_CCACHE=0
          mka bootimage

      # ========== 上传 Artifact（始终执行） ==========
      - name: 上传 recovery 镜像 (Artifact)
        if: github.event.inputs.build_target == 'recovery'
        uses: actions/upload-artifact@v4
        with:
          name: twrp-recovery-${{ github.event.inputs.device_tree_branch }}-${{ github.sha }}
          path: twrp/out/target/product/*/recovery.img
          if-no-files-found: error

      - name: 上传 vendor_boot 镜像 (Artifact)
        if: github.event.inputs.build_target == 'vendor_boot'
        uses: actions/upload-artifact@v4
        with:
          name: twrp-vendor_boot-${{ github.event.inputs.device_tree_branch }}-${{ github.sha }}
          path: twrp/out/target/product/*/vendor_boot.img
          if-no-files-found: error

      - name: 上传 boot 镜像 (Artifact)
        if: github.event.inputs.build_target == 'boot'
        uses: actions/upload-artifact@v4
        with:
          name: twrp-boot-${{ github.event.inputs.device_tree_branch }}-${{ github.sha }}
          path: twrp/out/target/product/*/boot.img
          if-no-files-found: error

      - name: 上传刷机包 ZIP (Artifact)
        if: github.event.inputs.upload_zip == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: twrp-flashable-${{ github.event.inputs.device_tree_branch }}-${{ github.sha }}
          path: twrp/out/target/product/*/*.zip
          if-no-files-found: warn

      # ========== 可选：上传到 GitHub Release ==========
      - name: 准备 release 资产
        if: github.event.inputs.upload_release == 'true'
        run: |
          mkdir -p release_assets
          case "${{ github.event.inputs.build_target }}" in
            recovery)
              cp twrp/out/target/product/*/recovery.img release_assets/ 2>/dev/null || true
              ;;
            vendor_boot)
              cp twrp/out/target/product/*/vendor_boot.img release_assets/ 2>/dev/null || true
              ;;
            boot)
              cp twrp/out/target/product/*/boot.img release_assets/ 2>/dev/null || true
              ;;
          esac
          if [ "${{ github.event.inputs.upload_zip }}" == "true" ]; then
            cp twrp/out/target/product/*/*.zip release_assets/ 2>/dev/null || true
          fi
          echo "📦 Release 资产列表："
          ls -la release_assets/ || echo "没有找到任何文件"

      # 新增：生成 Release 说明（包含设备名、日期、镜像、分支、commit、MD5）
      - name: 生成 Release 说明
        if: github.event.inputs.upload_release == 'true'
        id: release_body
        run: |
          # 提取设备代号（从 device_tree_path 最后一段）
          DEVICE_PATH="${{ github.event.inputs.device_tree_path }}"
          DEVICE_NAME=$(basename "$DEVICE_PATH")
          if [ -z "$DEVICE_NAME" ]; then
            DEVICE_NAME="Unknown"
          fi
          
          # 当前日期 YYYYMMDD
          BUILD_DATE=$(date +%Y%m%d)
          
          # 编译目标镜像名称
          case "${{ github.event.inputs.build_target }}" in
            recovery)
              TARGET_IMG="recovery.img"
              ;;
            vendor_boot)
              TARGET_IMG="vendor_boot.img"
              ;;
            boot)
              TARGET_IMG="boot.img"
              ;;
          esac
          
          # Build 分支（manifest 分支）
          BUILD_BRANCH="${{ steps.manifest_branch.outputs.branch }}"
          
          # 设备树仓库和分支
          DEVICE_REPO="${{ github.event.inputs.device_tree_repo_url }}"
          DEVICE_BRANCH="${{ github.event.inputs.device_tree_branch }}"
          
          # 获取设备树最近一次 commit
          cd twrp/${{ github.event.inputs.device_tree_path }}
          COMMIT_HASH=$(git log -1 --format="%h")
          COMMIT_MSG=$(git log -1 --format="%s")
          COMMIT_INFO="${COMMIT_HASH} ${COMMIT_MSG}"
          
          # 计算主要 IMG 文件的 MD5
          IMG_FILE="release_assets/${TARGET_IMG}"
          if [ -f "$IMG_FILE" ]; then
            MD5_SUM=$(md5sum "$IMG_FILE" | cut -d' ' -f1)
          else
            MD5_SUM="未找到文件"
          fi
          
          # 生成 Release 说明正文
          cat <<EOF > release_body.txt
          Unofficial TWRP for ${DEVICE_NAME} device // ${BUILD_DATE}
          Target: ${TARGET_IMG}
          Build: ${BUILD_BRANCH}
          Device: ${DEVICE_REPO} (${DEVICE_BRANCH})
          Commit: ${COMMIT_INFO}
          MD5 (${TARGET_IMG}): ${MD5_SUM}
          EOF
          
          echo "✅ Release 说明已生成："
          cat release_body.txt

      - name: 创建 GitHub Release 并上传产物
        if: github.event.inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twrp-build-${{ github.run_id }}
          name: "TWRP Build ${{ github.run_id }}"
          body_path: release_body.txt   # 使用生成的说明文件
          draft: false
          prerelease: true
          files: release_assets/*
          fail_on_unmatched_files: false
